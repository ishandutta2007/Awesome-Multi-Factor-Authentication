<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 44px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 13px; fill: #38bdf8; }
    
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
    }

    @keyframes scanLine {
      0% { transform: translateY(0px); opacity: 0.2; }
      50% { opacity: 0.8; }
      100% { transform: translateY(220px); opacity: 0.2; }
    }

    @keyframes floatParticle {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-15px); }
      100% { transform: translateY(0px); }
    }

    .animated-shield { animation: pulseGlow 4s ease-in-out infinite; transform-origin: 1000px 160px; }
    .scan-element { animation: scanLine 5s linear infinite; }
    .particle { animation: floatParticle 3s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid Lines in Background -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <path d="M 0,40 L 1200,40 M 0,80 L 1200,80 M 0,120 L 1200,120 M 0,160 L 1200,160 M 0,200 L 1200,200 M 0,240 L 1200,240 M 0,280 L 1200,280" />
    <path d="M 100,0 L 100,320 M 200,0 L 200,320 M 300,0 L 300,320 M 400,0 L 400,320 M 500,0 L 500,320 M 600,0 L 600,320 M 700,0 L 700,320 M 800,0 L 800,320 M 900,0 L 900,320 M 1000,0 L 1000,320 M 1100,0 L 1100,320" />
  </g>

  <!-- Dynamic Background Glowing Shield -->
  <g class="animated-shield">
    <path d="M1000,60 L1080,90 V170 C1080,220 1000,250 1000,250 C1000,250 920,220 920,170 V90 Z" fill="url(#shieldGrad)" stroke="#6366f1" stroke-width="2" />
    <circle cx="1000" cy="155" r="25" fill="none" stroke="#38bdf8" stroke-width="3" filter="url(#glow)" />
    <path d="M1000,140 V155 L1010,165" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Floating Particles in Background -->
  <circle cx="150" cy="70" r="4" fill="#6366f1" class="particle" opacity="0.6" />
  <circle cx="850" cy="240" r="5" fill="#38bdf8" class="particle" style="animation-delay: 1s;" opacity="0.5" />
  <circle cx="1120" cy="80" r="3" fill="#d946ef" class="particle" style="animation-delay: 2s;" opacity="0.7" />

  <!-- Scanning Line Effect -->
  <line x1="880" y1="50" x2="1120" y2="50" stroke="#38bdf8" stroke-width="2" class="scan-element" opacity="0.5" filter="url(#glow)" />

  <!-- Decorative Top Pill -->
  <rect x="80" y="55" width="230" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <circle cx="96" cy="71" r="5" fill="#10b981" />
  <text x="110" y="76" class="badge-text">OCTOBER 2026 UPDATED</text>

  <!-- Title & Subtitle -->
  <text x="80" y="135" class="title">Awesome Multi-Factor Authentication</text>
  <text x="80" y="175" class="subtitle">Curated collection of SaaS MFA platforms, TOTP apps, Passkeys &amp; Self-Hosted IAM</text>

  <!-- Bottom Tags -->
  <g transform="translate(80, 215)">
    <rect x="0" y="0" width="140" height="30" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
    <text x="14" y="20" font-family="sans-serif" font-size="13" fill="#a5b4fc" font-weight="600">🔐 TOTP &amp; HOTP</text>

    <rect x="152" y="0" width="130" height="30" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1" />
    <text x="166" y="20" font-family="sans-serif" font-size="13" fill="#6ee7b7" font-weight="600">🔑 FIDO2 / WebAuthn</text>

    <rect x="294" y="0" width="140" height="30" rx="8" fill="#311042" stroke="#d946ef" stroke-width="1" />
    <text x="308" y="20" font-family="sans-serif" font-size="13" fill="#f0abfc" font-weight="600">🛡️ Self-Hosted IAM</text>
  </g>

  <!-- Bottom Accent Gradient Line -->
  <rect x="0" y="312" width="1200" height="8" fill="url(#accentGrad)" />
</svg>
